<html lang="en">
<head>

<style>
/* Continue + History — Module 10 */
.history-header {
  padding: var(--gap-xl) 0 var(--gap-lg);
  border-bottom: 1px solid var(--signal-mute);
  margin-bottom: var(--gap-xl);
}

/* Continue row */
.continue-banner {
  background: var(--void-2);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: var(--gap-lg);
  display: flex;
  align-items: center;
  gap: var(--gap-lg);
  margin-bottom: var(--gap-xl);
  position: relative;
  overflow: hidden;
}
.continue-banner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.continue-kanji {
  font-family: var(--font-jp);
  font-size: 2.4rem;
  color: var(--gold);
  opacity: 0.6;
  flex-shrink: 0;
  line-height: 1;
}
.continue-info { flex: 1; min-width: 0; }
.continue-label {
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 4px;
}
.continue-title {
  font-family: var(--font-display);
  font-size: 1.3rem;
  color: var(--signal);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.continue-meta { font-size: 0.68rem; color: var(--signal-mute); margin-top: 4px; }

.continue-progress-wrap { margin-top: 8px; }
.continue-pct {
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--gold);
  margin-bottom: 4px;
}

/* Stats strip */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: var(--gap-xl);
}
@media (max-width: 640px) { .stats-strip { grid-template-columns: repeat(2, 1fr); } }
.stat-cell {
  background: var(--void-2);
  border: 1px solid var(--void-3);
  border-radius: var(--radius);
  padding: var(--gap);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--signal);
  line-height: 1;
}
.stat-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--signal-mute); }
.stat-streak { color: var(--gold); }

/* Filter row */
.filter-row {
  display: flex;
  gap: var(--gap-sm);
  margin-bottom: var(--gap);
  align-items: center;
  flex-wrap: wrap;
}
.filter-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--signal-mute); margin-right: 4px; }

/* History list */
.session-row {
  display: grid;
  grid-template-columns: 48px 1fr auto auto;
  gap: var(--gap);
  padding: var(--gap) 0;
  border-bottom: 1px solid var(--void-3);
  align-items: center;
  cursor: pointer;
  transition: var(--transition);
}
.session-row:hover { background: var(--void-3); border-radius: var(--radius); padding-left: var(--gap-sm); padding-right: var(--gap-sm); margin: 0 calc(-1 * var(--gap-sm)); }
.session-date { font-size: 0.62rem; color: var(--signal-mute); text-align: center; letter-spacing: 0.04em; line-height: 1.3; }
.session-date .day { font-size: 1rem; color: var(--signal-dim); font-family: var(--font-display); }
.session-main { min-width: 0; }
.session-protocol { font-family: var(--font-display); font-size: 1rem; font-style: italic; color: var(--signal); margin-bottom: 2px; }
.session-protocol-id { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--signal-mute); }
.session-dur { font-size: 0.7rem; color: var(--signal-dim); text-align: right; white-space: nowrap; }
.session-status { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.session-status.complete { color: var(--gold); }
.session-status.partial { color: var(--signal-mute); }

/* Repeat count badge */
.repeat-badge {
  display: inline-flex;
  font-size: 0.56rem;
  letter-spacing: 0.1em;
  color: var(--signal-mute);
  border: 1px solid var(--signal-mute);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  margin-left: 6px;
}

/* Streak calendar */
.streak-section { margin-bottom: var(--gap-xl); }
.streak-grid {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  margin-top: var(--gap);
}
.streak-cell {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: var(--void-3);
}
.streak-cell.active { background: var(--gold-dim); }
.streak-cell.today { background: var(--gold); }
</style>

</head>
<body data-shell="app" data-page="history">
<nav class="topbar">
  <span class="topbar-brand">間</span>
  <div class="topbar-nav">
    <span class="topbar-trial" id="trialBadge">▸ FREE TRIAL</span>
    <a href="app.html" class="topbar-link">HOME</a>
    <a href="search.html" class="topbar-link">LIBRARY</a>
    <a href="history.html" class="topbar-link active">HISTORY</a>
    <a href="favorites.html" class="topbar-link">SAVED</a>
    <button class="topbar-user standby" id="oauthBtn" title="Open practice">◎ STANDBY</button>
  </div>
</nav>

<div class="page">
  <div class="container">

    <div class="history-header">
      <div class="label" style="margin-bottom:8px">Continue + History</div>
      <div class="display-title" style="font-size:2rem">Your Practice</div>
    </div>

    <!-- Continue row -->
    <div id="continueSection"></div>

    <!-- Stats -->
    <div class="stats-strip" id="statsStrip">
      <div class="stat-cell">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Sessions</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="statMinutes">0</span>
        <span class="stat-label">Minutes</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num stat-streak" id="statStreak">0</span>
        <span class="stat-label">Day Streak</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="statComplete">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </div>

    <!-- Streak calendar (last 28 days) -->
    <div class="streak-section">
      <div class="section-title" style="font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--signal-mute);margin-bottom:var(--gap);display:flex;align-items:center;gap:8px">
        Activity
        <span style="flex:1;height:1px;background:var(--void-3);display:block"></span>
      </div>
      <div class="streak-grid" id="streakGrid"></div>
      <div style="margin-top:6px;font-size:0.6rem;color:var(--signal-mute)">Last 28 days</div>
    </div>

    <!-- Filter -->
    <div class="filter-row">
      <span class="filter-label">Show:</span>
      <button class="tag active" id="filterAll" onclick="setFilter('all')">All</button>
      <button class="tag" id="filterComplete" onclick="setFilter('complete')">Completed</button>
      <button class="tag" id="filterPartial" onclick="setFilter('partial')">Partial</button>
    </div>

    <!-- History list -->
    <div id="historyList"></div>
    <div id="historyEmpty" style="display:none">
      <div class="empty-state">
        <div class="empty-glyph">歴</div>
        <div class="empty-title">No sessions yet</div>
        <div class="empty-body">Your practice history will appear here after your first session.</div>
        <a href="search.html" class="btn btn-ghost" style="margin-top:16px">BEGIN FIRST SESSION</a>
      </div>
    </div>

  </div>
</div>

<script src="js/db.js?v=20260309p6"></script>
<script>
// Continue + History — Module 10
let currentFilter = 'all';

function renderTrialBadge() {
  const user = MAZEN_DB.getUser();
  const badge = document.getElementById('trialBadge');
  if (user.tier === 'free_trial') {
    badge.textContent = `▸ ${user.trial_days_remaining} DAY FREE TRIAL`;
  } else {
    badge.style.display = 'none';
  }
}

function fmtDate(ts) {
  const d = new Date(ts);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return { day: d.getDate(), mon: months[d.getMonth()], time: d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
}

function renderContinue(sessions) {
  const container = document.getElementById('continueSection');
  const incomplete = sessions.find(s => !s.completed && s.elapsed > 30);
  if (!incomplete) { container.innerHTML = ''; return; }

  const protocols = MAZEN_DB.getProtocols();
  const p = protocols.find(pr => pr.id === incomplete.protocolId);
  if (!p) return;

  container.innerHTML = `
    <div class="continue-banner">
      <div class="continue-kanji">${p.title}</div>
      <div class="continue-info">
        <div class="continue-label">Continue Where You Left Off</div>
        <div class="continue-title">${p.romanji} — ${p.subtitle}</div>
        <div class="continue-meta">
          Phase ${incomplete.phase + 1} of ${p.phases.length} · ${incomplete.progressPct||0}% complete
        </div>
        <div class="continue-progress-wrap">
          <div class="continue-pct">${incomplete.progressPct||0}%</div>
          <div class="progress-track" style="width:160px">
            <div class="progress-fill" style="width:${incomplete.progressPct||0}%"></div>
          </div>
        </div>
      </div>
      <div style="flex-shrink:0">
        <a href="player.html?id=${p.id}&sess=${incomplete.id}" class="btn btn-primary">RESUME</a>
      </div>
    </div>
  `;
}

function renderStats(sessions) {
  const completed = sessions.filter(s => s.completed);
  const totalMin = sessions.reduce((sum, s) => sum + (s.durationMin || Math.round((s.elapsed||0)/60)), 0);
  const streak = MAZEN_DB.getStreak();

  document.getElementById('statTotal').textContent = sessions.length;
  document.getElementById('statMinutes').textContent = totalMin;
  document.getElementById('statStreak').textContent = streak.current;
  document.getElementById('statComplete').textContent = completed.length;
}

function renderStreakGrid(sessions) {
  const grid = document.getElementById('streakGrid');
  const sessionDates = new Set(
    sessions.filter(s => s.completed).map(s => new Date(s.createdAt||s.startedAt||Date.now()).toDateString())
  );

  const today = new Date().toDateString();
  const cells = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toDateString();
    const cls = d === today ? 'streak-cell today' : sessionDates.has(d) ? 'streak-cell active' : 'streak-cell';
    cells.push(`<div class="${cls}" title="${d}"></div>`);
  }
  grid.innerHTML = cells.join('');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-row .tag').forEach(el => el.classList.remove('active'));
  document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1)).classList.add('active');
  renderHistory();
}

function renderHistory() {
  let sessions = MAZEN_DB.getSessions();
  if (currentFilter === 'complete') sessions = sessions.filter(s => s.completed);
  if (currentFilter === 'partial')  sessions = sessions.filter(s => !s.completed);

  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');

  if (sessions.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Count repeats by protocol
  const repeatCounts = {};
  MAZEN_DB.getSessions().forEach(s => {
    repeatCounts[s.protocolId] = (repeatCounts[s.protocolId] || 0) + 1;
  });

  list.innerHTML = sessions.map(s => {
    const ts = s.createdAt || s.startedAt || Date.now();
    const d = fmtDate(ts);
    const dur = s.durationMin || Math.round((s.elapsed||0)/60) || '—';
    const statusClass = s.completed ? 'complete' : 'partial';
    const statusText = s.completed ? '✓ COMPLETE' : `${s.progressPct||0}%`;
    const repeats = repeatCounts[s.protocolId] || 1;
    return `
      <div class="session-row" onclick="goToProtocol('${s.protocolId}')">
        <div class="session-date">
          <div class="day">${d.day}</div>
          <div>${d.mon}</div>
          <div>${d.time}</div>
        </div>
        <div class="session-main">
          <div class="session-protocol">${s.protocolTitle || s.protocolId}
            ${repeats > 1 ? `<span class="repeat-badge">×${repeats}</span>` : ''}
          </div>
          <div class="session-protocol-id">${s.protocolId}</div>
        </div>
        <div class="session-dur">${dur}m</div>
        <div class="session-status ${statusClass}">${statusText}</div>
      </div>
    `;
  }).join('');
}

function goToProtocol(id) {
  window.location.href = `protocol.html?id=${id}`;
}

document.getElementById('oauthBtn').addEventListener('click', function() {
  alert('Opening simulated sign-in….\nYour session data is stored locally.');
});

async function init() {
  renderTrialBadge();
  await MAZEN_DB.loadProtocols();
  const sessions = MAZEN_DB.getSessions();
  renderContinue(sessions);
  renderStats(sessions);
  renderStreakGrid(sessions);
  renderHistory();
}

init();
</script>
<script src="js/state.js?v=20260309p6"></script>
<script src="js/shell.js?v=20260309p6"></script>
</body>
</html>
